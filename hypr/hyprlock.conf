general {
    hide_cursor = false
    ignore_empty_input = false
    immediate_render = false
    fail_timeout = 2000
}

auth {
    fingerprint {
        enabled = true
        ready_message = Or gib finger...
        present_message = Scanning...
        retry_delay = 250
    }
}

background {
    monitor =
    path = screenshot
    color = rgba(25, 23, 36, 1.0)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.05
}

label {
    monitor =
    text = $TIME
    color = rgba(224, 222, 244, 1.0)
    font_size = 98
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d")"
    color = rgba(144, 140, 170, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 350, 50
    outline_thickness = 2
    rounding = -1
    inner_color = rgba(31, 29, 46, 0.5)
    outer_color = rgba(235, 188, 186, 1.0)
    font_color = rgba(224, 222, 244, 1.0)
    capslock_color = rgba(235, 188, 186, 1.0)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = Gib bassword...
    fail_text = woopsies.. try aagain ;/
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    check_color = rgba(235, 188, 186, 0.3)
    fail_color = rgba(235, 111, 146, 1.0)
    position = 0, -30
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:500] echo "$(cat /sys/class/leds/input*::capslock/brightness 2>/dev/null | grep -q 1 && echo 'Caps Lock is pressed' || echo '')"
    color = rgba(144, 140, 170, 0.6)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -75
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(144, 140, 170, 0.7)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = Welcome back, $USER
    color = rgba(144, 140, 170, 0.6)
    font_size = 21
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = bottom
}

label {
    monitor =
    text = Click to logout
    color = rgba(144, 140, 170, 0.7)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    onclick = hyprctl dispatch exit
    position = 0, 60
    halign = center
    valign = bottom
}
